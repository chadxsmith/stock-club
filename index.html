<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stock Club</title>
<style>html,body{margin:0;height:100%;background:#000;}</style>
</head>
<body>
<script>
(function () {
  var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  var wide = Math.min(window.innerWidth, screen.width) >= 1024;
  var q = location.search;
  var forced = /[?&]view=(desktop|mobile)/.exec(q);
  var target = forced ? forced[1] : (wide && !coarse ? 'desktop' : 'mobile');
  location.replace(target === 'desktop' ? 'desktop.html' : 'mobile.html');
})();
</script>
</body>
</html>
